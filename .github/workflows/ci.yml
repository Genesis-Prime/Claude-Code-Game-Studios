name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    name: Security regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD

      - name: Check shell syntax
        run: find .claude tests -type f -name '*.sh' -print0 | xargs -0 bash -n

      - name: Check Python syntax
        run: python -I -c 'from pathlib import Path; p = Path(".claude/hooks/read-session-state.py"); compile(p.read_bytes(), str(p), "exec")'

      - name: Run security regression suite
        run: bash tests/security-regression.sh
